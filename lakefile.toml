name = "Dcc"
version = "0.1.0"
defaultTargets = ["Dcc"]

[[lean_lib]]
name = "Dcc"

[[require]]
name = "verso-slides"
git = "https://github.com/leanprover/verso-slides"
rev = "main"

[[lean_lib]]
name = "DccSlides"
needs = ["@Dcc/+Dcc:highlighted"]

[[lean_exe]]
name = "docs"
root = "Slides"
needs = ["@Dcc/+Dcc:highlighted"]
srcDir = "."

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.29.1"
