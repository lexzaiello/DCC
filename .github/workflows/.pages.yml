on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nix
        uses: cachix/install-nix-action@v27
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Nix
        run: mkdir -p public && nix build .#tex && sudo cp $(nix build .#tex --print-out-paths)/paper4/paper4.pdf /public/dcc_paper.pdf
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /public

  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
