name = "Dcc"
version = "0.1.0"
defaultTargets = ["Dcc"]

[[lean_lib]]
name = "Dcc"

[[require]]
name = "verso-slides"
git = "https://github.com/leanprover/verso-slides"
rev = "main"

[[require]]
name = "Lean4Lean.Theory"
git = "https://github.com/digama0/lean4lean"
rev = "master"

[[lean_lib]]
name = "DccSlides"
needs = ["@Dcc/+Dcc:highlighted", "+Lean4Lean.Theory.Typing.Strong:highlighted"]

[[lean_exe]]
name = "docs"
root = "Slides"
srcDir = "."

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.30.0-rc2"
